<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trading Candles + Buy/Sell</title>

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        body {
            margin: 0;
            background: #0d1117;
            font-family: Arial;
            color: white;
        }

        /* ===== TOP BAR ===== */
        #topbar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #buy {
            background: #00ff88;
            color: black;
        }

        #sell {
            background: #ff4d4d;
            color: white;
        }

        /* ===== LOG PANEL ===== */
        #log {
            position: absolute;
            right: 10px;
            top: 10px;
            width: 220px;
            height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* ===== CHART ===== */
        #chart {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

<!-- UI -->
<div id="topbar">
    <button id="buy">BUY </button>
    <button id="sell">SELL </button>
</div>

<div id="log"></div>

<div id="chart"></div>

<script>

    // =====================
    // CHART
    // =====================
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: {
            background: { color: '#0d1117' },
            textColor: '#d1d4dc'
        },
        grid: {
            vertLines: { color: '#1f2937' },
            horzLines: { color: '#1f2937' }
        },
        timeScale: {
            timeVisible: true,
            secondsVisible: true
        }
    });

    const candles = chart.addSeries(
        LightweightCharts.CandlestickSeries,
        {
            upColor: '#00ff88',
            downColor: '#ff4d4d',
            borderVisible: false,
            wickUpColor: '#00ff88',
            wickDownColor: '#ff4d4d'
        }
    );

    // =====================
    // STATE
    // =====================
    let candle = null;
    let timeIndex = Math.floor(Date.now() / 1000);

    // =====================
    // LOG FUNCTION
    // =====================
    function addLog(msg) {
        const log = document.getElementById("log");
        const div = document.createElement("div");
        div.innerText = msg;
        log.prepend(div);
    }

    // =====================
    // BUY / SELL MARKERS
    // =====================
    function addMarker(type) {

        const price = candle ? candle.close : 0;
        const time = candle ? candle.time : timeIndex;

        const marker = {
            time,
            position: type === "BUY" ? "belowBar" : "aboveBar",
            color: type === "BUY" ? "#00ff88" : "#ff4d4d",
            shape: type === "BUY" ? "arrowUp" : "arrowDown",
            text: type
        };

        candles.setMarkers([marker]);

        addLog(type + " @ " + price);
    }

    // =====================
    // BUTTON EVENTS
    // =====================
    document.getElementById("buy").onclick = () => addMarker("BUY");
    document.getElementById("sell").onclick = () => addMarker("SELL");

    // =====================
    // BUILD CANDLES
    // =====================
    function build(price) {

        timeIndex++;

        if (!candle) {
            candle = {
                time: timeIndex,
                open: price,
                high: price,
                low: price,
                close: price
            };

            candles.setData([candle]);
            return;
        }

        const isNew = timeIndex % 3 === 0;

        if (isNew) {
            candle = {
                time: timeIndex,
                open: price,
                high: price,
                low: price,
                close: price
            };
        } else {
            candle.close = price;
            candle.high = Math.max(candle.high, price);
            candle.low = Math.min(candle.low, price);
        }

        candles.update(candle);
    }

    // =====================
    // SSE
    // =====================
    const source = new EventSource("/analytics");

    source.onmessage = function(event) {

        if (!event.data || event.data === "{}") return;

        let data;
        try {
            data = JSON.parse(event.data);
        } catch {
            return;
        }

        const price = Object.values(data)[0];

        build(price);
    };

</script>

</body>
</html>
